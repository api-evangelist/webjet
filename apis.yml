- aid: webjet:tripninja-hotels-api
  name: Trip Ninja Hotels API
  description: >-
    A hotel shopping surface — Search (POST /search/hotels/{endpoint}), Details (POST
    /details/hotels/{endpoint}/), Rules (POST /rules/hotels/{endpoint}/) and PriceConfirm plus a
    price-confirmation removal (POST and DELETE on /price/hotels/{endpoint}/) — published only in
    Trip Ninja's public GitHub documentation repository. The schema set includes a webbeds_room_obj,
    indicating WebBeds-shaped room content. Hotels are not mentioned anywhere on the current
    developer hub, which documents flights only; availability is unverified.
  humanURL: https://github.com/trip-ninja-inc/trip_ninja_api_docs
  baseURL: https://preprodapi.tripninja.io
  tags:
