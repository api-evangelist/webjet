- aid: webjet:tripninja-pricing-booking-api
  name: Trip Ninja Pricing & Booking API
  description: >-
    The fullest Trip Ninja transaction surface, published in Trip Ninja's public GitHub documentation
    repository. Seven operations with real operationIds — PriceConfirm (POST /price/{endpoint}/),
    CreateBooking (POST /book/{endpoint}/), BookingDetail (GET /book/trip/{super_trip_id}/),
    ListBooking (GET /book/list/), AddBookingToTicketingQueue (POST /queue/), Ticket (POST /ticket/)
    and CancelBooking (DELETE /book/). It is the only Trip Ninja surface anywhere with read
    operations and the only one with pagination (offset/limit on ListBooking), and it carries the
    passenger, PNR and super_trip_id models that group the multiple PNRs of a split-ticket journey.
    Last updated 2023-12-14; not documented on the current developer hub, so availability is
    unverified.
  humanURL: https://github.com/trip-ninja-inc/trip_ninja_api_docs
  baseURL: https://preprodapi.tripninja.io
  tags:
  - Booking
  - Pricing
  - Ticketing
