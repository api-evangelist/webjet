aid: webjet
url: https://raw.githubusercontent.com/api-evangelist/webjet/refs/heads/main/apis.yml
name: Webjet
kind: company
description: >-
  Webjet Group Limited (ASX: WJL) is the Australian consumer travel company created when Webjet
  Limited demerged in September 2024 — the B2C half, while the B2B WebBeds bed bank went to Web
  Travel Group (ASX: WEB). It operates Webjet OTA (webjet.com.au / webjet.co.nz), which the company
  describes as the number one online travel agency position in Australia and New Zealand; the GoSee
  vehicle-rental brands Airport Rentals and Motorhome Republic; and Trip Ninja, a travel-technology
  business selling flight-construction software to other travel platforms. Webjet sits downstream of
  airline distribution — it resells airline content sourced through GDS and NDC connections rather
  than owning inventory, and holds ATIA/ATAS accreditation A17325 with an IATA accredited agent
  entity (Webjet Marketing). Its API posture is honestly lopsided: the consumer brands publish no
  developer documentation and no public API at all (developer/api/docs subdomains do not resolve;
  www.webjet.com.au returns 403 to non-browser clients), while the group's only public API surface
  is Trip Ninja's: the SmartFlights developer hub at devhub.tripninja.io, with eleven OpenAPI 3.0.0
  documents rendered in-page, plus six further OpenAPI 3.0.0 documents published in Trip Ninja's own
  GitHub organisation (trip-ninja-inc/trip_ninja_api_docs) covering flights core, pricing/booking/
  ticketing, hotels, MSDP dynamic packaging and the v2 legacy surface. Seventeen specifications in
  all, and two Apache-2.0 client libraries on PyPI and NuGet. Docs are freely readable but access is
  zero self-serve: production use requires a commercial agreement, Trip Ninja-issued admin panel
  credentials, IP allow-listing and a certification pass, every API host returns 403 to a
  non-allow-listed IP, and no data-export operation is published.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/groq.png
