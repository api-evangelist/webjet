- aid: webjet:tripninja-msdp-api
  name: Trip Ninja MSDP (Dynamic Packaging) API
  description: >-
    MSDP is Trip Ninja's multi-source dynamic packaging product — flights and hotels combined into
    one sellable package. Nine operations with real operationIds: MSDPSearch, MSDPGetFlightResults,
    MSDPGetHotelResults, MSDPRemoveHotelResult, MSDPGetHotelDetails, MSDPPriceConfirmationReport,
    MSDPBookingReport, MSDPTicketingReport and MSDPCancelBookingReport. It is the only Trip Ninja
    specification with typed per-operation error schemas (MSDPSearchErrorDetails,
    MSDPOTABookingErrorDetails and siblings) rather than the generic {status, message} envelope. The
    developer hub carries a /dynamic-packaging/ route with no page behind it, so this
    GitHub-published document is the only machine-readable description of the product.
  humanURL: https://github.com/trip-ninja-inc/trip_ninja_api_docs
  baseURL: https://preprodapi.tripninja.io
  tags:
  - Dynamic Packaging
  - Hotels
  - Flight Search
  - Booking
  properties:
  - type: OpenAPI
    url: openapi/webjet-tripninja-msdp-openapi.yml
  - type: Overlay
    url: overlays/webjet-msdp-overlay.yaml
  - type: SourceCode
    url: https://github.com/trip-ninja-inc/trip_ninja_api_docs
- aid: webjet:tripninja-v2-legacy-api
  name: Trip Ninja v2 Legacy API
  description: >-
    Two further GitHub-published OpenAPI 3.0.0 documents describing the 2.0.0-era surface — a core
    document (/get-searches/, /generate-solutions/) and a booking document (Search, PriceConfirm,
    CreateBooking, CancelBooking, AddBookingToTicketingQueue, Ticket, SuperTrip and
    SuperTripPartDeletion). They predate the v2 FareStructure and Virtual Interlining documentation
    now served under devhub.tripninja.io/deprecated/, and are recorded for completeness of the
    published corpus.
  humanURL: https://github.com/trip-ninja-inc/trip_ninja_api_docs
  baseURL: https://preprodapi.tripninja.io
