apis:
- aid: webjet:tripninja-smartflights-api
  name: Trip Ninja SmartFlights API
  description: >-
    SmartFlights is Trip Ninja's current (v3) flight-construction API. A travel platform posts a
    traveller search to /v3/get-searches/, Trip Ninja returns the set of optimised content queries to
    run against the platform's own content sources (GDS, NDC or aggregator), the platform posts those
    zlib-compressed provider responses to /v3/generate-solutions/, and SmartFlights returns unified —
    including split-ticket and virtual-interlined — itineraries with machine-learned markups. Booked
    and cancelled itineraries are reported back via /v3/report/book/ and /v3/report/cancel/. Trip
    Ninja supplies no air content of its own. REST/JSON, token authentication
    (Authorization: Token <access_token>, 90-day expiry).
  humanURL: https://devhub.tripninja.io/smartflights/overview/
  baseURL: https://sandbox.tripninja.io
  tags:
  - Flight Search
  - Shopping
  - Offers
  - Booking
  - Reporting
  - Virtual Interlining
