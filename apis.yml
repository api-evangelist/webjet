  - type: Portal
    url: https://app.tripninja.io
- aid: webjet:tripninja-farestructure-api
  name: Trip Ninja FareStructure API (deprecated)
  description: >-
    FareStructure is the deprecated v2 predecessor to SmartFlights, still published under
    devhub.tripninja.io/deprecated/farestructure/. It automates split ticketing across multiple
    content sources to build multi-city itineraries priced below a single GDS search, over
    /v2/get-searches/, /v2/generate-solutions/, /v2/report/book/ and /v2/report/cancel/. Requires the
    consuming OTA to be able to hold one traveller itinerary across multiple PNRs.
  humanURL: https://devhub.tripninja.io/deprecated/farestructure/overview
  baseURL: https://sandbox.tripninja.io
