- aid: webjet:tripninja-virtual-interlining-api
  name: Trip Ninja Virtual Interlining API (deprecated)
  description: >-
    Virtual Interlining is the deprecated v2 product that combines segments from carriers with no
    interline agreement into a single sellable itinerary, published under
