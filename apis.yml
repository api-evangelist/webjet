- aid: webjet:tripninja-datastream-api
  name: Trip Ninja DataStream API
  description: >-
    DataStream is a separately-credentialled Trip Ninja product with its own documentation section
    (setup, authentication, integration lifecycle) and its own public Postman collection. It uses the
    same Token Authentication scheme as SmartFlights, with a DataStream-specific token generated in
    the Admin Panel's Developer Resources section (is_datastream_token on the refresh-token
    response). No OpenAPI document and no base URL for DataStream are published on the developer hub,
    so none is recorded here.
  humanURL: https://devhub.tripninja.io/data-stream/overview/
