- aid: webjet:tripninja-flights-core-api
  name: Trip Ninja Flights Core API
  description: >-
    A flight search and reporting surface published by Trip Ninja in its own public GitHub
    documentation repository (github.com/trip-ninja-inc/trip_ninja_api_docs) rather than on the
    developer hub. Five operations with real operationIds: FlightSearch (POST /search/flights/
    {endpoint}/), PriceConfirmationReport (POST /pre-booking/), BookingReport (POST /booking/),
    TicketingReport (POST /ticketing/) and CancelBookingReport (POST /cancel/). It is the older shape
    of the reporting loop the current v3 SmartFlights surface expresses as /v3/report/book/ and
    /v3/report/cancel/, plus a ticketing report v3 no longer has. The named server is
    preprodapi.tripninja.io, which resolves and returns 403 "Missing Authentication Token" to
    non-allow-listed callers. Last updated in that repository on 2023-12-14 and not linked from the
    current developer hub; availability is unverified and nothing here is marked deprecated by Trip
    Ninja.
  humanURL: https://github.com/trip-ninja-inc/trip_ninja_api_docs
  baseURL: https://preprodapi.tripninja.io
  tags:
  - Flight Search
  - Reporting
  - Booking
  - Ticketing
  properties:
  - type: OpenAPI
    url: openapi/webjet-tripninja-flights-core-openapi.yml
  - type: Overlay
    url: overlays/webjet-flights-core-overlay.yaml
  - type: SourceCode
