- aid: webjet:tripninja-admin-panel-api
  name: Trip Ninja Admin Panel API
  description: >-
    The single documented Admin Panel operation, POST /adminpanel/refresh-token/, exchanges a
    refresh token for a new access token. Access tokens expire 90 days after issue; refresh tokens
    have an indefinite lifespan until regenerated, and using one issues a new refresh token as well.
    Response flags is_production_token and is_datastream_token distinguish sandbox from production
    and DataStream from SmartFlights credentials. Tokens are minted by a human in the Trip Ninja
    Admin Panel at app.tripninja.io, not by a self-serve signup.
  humanURL: https://devhub.tripninja.io/smartflights/authentication/
  baseURL: https://sandbox.tripninja.io
  tags:
  - Authentication
  - Tokens
  properties:
  - type: OpenAPI
    url: openapi/webjet-tripninja-adminpanel-refresh-token-openapi.yml
  - type: Documentation
    url: https://devhub.tripninja.io/smartflights/authentication/
  - type: Documentation
