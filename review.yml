aid: webjet
name: Webjet
review:
  question: >-
    What would it cost a customer of Webjet Group to leave — and does the group publish any real,
    documented API surface a developer can reach?
  date: '2026-07-28'
  reviewer: API Evangelist
  answer: >-
    Webjet Group's consumer brands publish nothing. Its subsidiary Trip Ninja publishes a genuinely
    open developer hub with eleven OpenAPI 3.0.0 documents, but nothing about it is self-serve, and
    the switching-cost story is unusually mild for travel: a one-month auto-renewing term with
    thirty days' notice, over an interface that is proprietary but sits on IATA identifiers the
    customer already owns.
findings:
  summary: |
    Webjet Group Limited (ASX: WJL) is the B2C remainder of Webjet Limited after the 23 September
    2024 demerger; the B2B WebBeds bed bank went to Web Travel Group (ASX: WEB) and is NOT covered by
    this profile. WJL comprises Webjet OTA (webjet.com.au / webjet.co.nz), the GoSee vehicle-rental
    brands Airport Rentals and Motorhome Republic, and Trip Ninja.

    Consumer side: no public API, no developer documentation, no partner portal. Every plausible
    developer subdomain for the consumer brands fails DNS. www.webjet.com.au and www.webjet.co.nz
    return 403 to non-browser clients; api.webjet.com.au resolves and serves the Webjet SPA shell
    (an internal booking-front-end host), and requests for /swagger.json and /openapi.json on it
    return that same HTML — not a spec. Third-party SEO pages (adivaha.com and similar) advertise a
    "Webjet Travel API" and "Webjet White Label"; no first-party corroboration was found for either,
    and neither is recorded in apis.yml.

    Technology side: Trip Ninja's developer hub (docs.tripninja.io, redirecting to
    devhub.tripninja.io) is publicly readable with no login. It is a Vite/React SPA that renders its
    API reference with RedocStandalone from OpenAPI 3.0.0 documents embedded in the page bundle
    rather than served as standalone files — no /openapi.json, /swagger.json or /.well-known/ path
    exists on the host (all catch to the SPA index or 302 to it). Eleven complete OpenAPI 3.0.0
    documents were extracted verbatim from that bundle and saved to openapi/.

    Products documented: SmartFlights (current, v3), FareStructure and Virtual Interlining (both
    marked deprecated and served under /deprecated/), DataStream (documented, no spec published), the
    Admin Panel refresh-token operation, and a compression SDK published to PyPI (tn-sdk) and NuGet
    (TripNinja.SDK). Public Postman collections exist for SmartFlights, FareStructure, DataStream and
    Virtual Interlining in the tripninjadevteam public workspace.

    Trip Ninja explicitly supplies no air content: "Trip Ninja specializes in optimizing the use of
    content sources for travel platforms ... without providing any content ourselves." It requires
    the customer to already hold "at least one active integration with a content source, such as a
    Global Distribution System (GDS), New Distribution Capability (NDC), or other flight aggregator"
    and to be able to book multiple PNRs per traveller itinerary.
