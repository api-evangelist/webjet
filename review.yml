switchingCost:
  interfaceShape:
    value: proprietary-documented
    standardNamed: >-
      No standard reference found. The interface implements neither IATA NDC (17.2/21.3/ONE Order),
      OpenTravel/OTA nor HTNG. It is a Trip Ninja-specific REST/JSON contract — /get-searches/,
      /generate-solutions/, /report/book/, /report/cancel/ — with its own request and response
      schemas (FullGenerateSolutionsRequest, DatasourceItineraryInfoWithMarkup, and so on) and its
      own zlib request-compression convention and IExx error codes. Authentication is a proprietary
      token scheme, "Authorization: Token <access_token>", not OAuth 2.0 and not HTTP Bearer.
    evidence: >-
      Eleven OpenAPI 3.0.0 documents harvested from devhub.tripninja.io on 2026-07-28 (see openapi/).
      Searched all eleven for NDC, OpenTravel, OTA-standard and HTNG references: the only occurrence
      of "NDC" is in the Multi-PNR prerequisites page, describing the customer's own upstream content
      source, never Trip Ninja's own interface.
    mitigant: >-
      The bind is real but shallow. Trip Ninja carries no content and stores no inventory: the
      customer keeps its own GDS/NDC connections and its own PNRs, and Trip Ninja is an optimisation
      layer in the middle of a search. Ripping it out costs the integration work and the loss of the
      trained markup models, not the customer's distribution relationships.
  secondSource:
    value: alternatives-with-migration
    alternativesConsidered: >-
      For the flight-construction / virtual-interlining / split-ticketing capability specifically,
      other vendors sell comparable products (Kiwi.com Tequila, Duffel, Skyscanner and Google Flights
      style multi-source construction, and the GDSs' own multi-source shopping). None of them
      implements Trip Ninja's interface, so a move is a re-integration project rather than a
      credential swap — no drop-in second source exists on this contract. Named alternatives are
      recorded here as market context only; no vendor comparison was published by Trip Ninja and none
      was fetched.
    note: >-
      For the consumer businesses the question is inverted. Webjet OTA is itself a second source — a
      traveller who wants an Australian OTA has Flight Centre, Expedia, Booking.com and the airlines'
      own sites. There is no capability a customer is locked into, because there is no customer-facing
      API to be locked into.
  exitPath:
    value: export-on-request
    operationCited: >-
      No export, dump, bulk or data-portability operation exists in any of the eleven harvested
      OpenAPI documents. The only outbound flow is reporting INTO Trip Ninja (/report/book/,
      /report/cancel/). Exit is contractual and manual, not an API call.
    publishedCommitments:
    - source: https://www.tripninja.io/legal/gdpr
      clause: >-
        "Trip Ninja and each Trip Ninja Affiliate shall promptly and in any event within sixty (60)
        days of the date of cessation of any Services involving the Processing of Customer Personal
        Data (the 'Cessation Date'), return all Customer Personal Data to the Customer."
    - source: https://www.tripninja.io/legal/gdpr
      clause: >-
        "Customer may in its absolute discretion by written notice to Trip Ninja within 30 days of the
        Cessation Date require Trip Ninja and each Trip Ninja Affiliate to (a) return a complete copy
        of all Customer Personal Data to Customer by secure file transfer in such format as is
        reasonably notified by Customer to Trip Ninja..."
    - source: https://www.tripninja.io/legal/qt-tc
      clause: >-
        Trip Ninja may "delete or return all Customer Data ... to the extent technically feasible save
        as required by any applicable law".
    carveOut: >-
      The customer's own data comes back, but the derived value does not. The ToS reserves to Trip
      Ninja "all data derived in the process of providing the Services which is part of Company's
      machine learning algorithms" — i.e. the markup models trained on the customer's own booking and
      search behaviour stay with the vendor. That is the one genuinely non-portable asset in this
      relationship.
  identifierPortability:
    value: >-
      Shared IATA identifiers dominate, with a thin layer of vendor-opaque request IDs on top.
    detail: >-
      Harvested schemas hang on IATA three-letter city/airport codes (from_iata / to_iata, with an
      explicit "C" city vs "A" airport qualifier), IATA two-letter carrier codes, IATA passenger type
      codes (ADT, MIL, CHD, INF), ISO currency codes, and PNR record locators — the docs treat
      multi-PNR handling as a customer prerequisite and instruct platforms to display the Booking
      Codes (PNR numbers) per ticket. The vendor-specific keys are session-scoped rather than
      permanent: trip_id, itinerary_id and 40-character hex booking identifiers, plus a
      customer_booking_reference_id field explicitly reserved for the customer's OWN booking
      reference (max 255 characters). At the corporate level Webjet carries portable industry
      identifiers too: ATIA/ATAS accreditation A17325 and an IATA accredited agent entity (Webjet
      Marketing). No GIATA IDs, hotel chain codes or GDS-proprietary record IDs appear, because this
      is an air-only, content-free product.
    verdict: >-
      This is the low-lock-in end of travel. The data a customer would have to carry to a competitor
      is written in industry codes anybody can read.
  contractualLockIn:
    published: true
    source: https://www.tripninja.io/legal/qt-tc
    clauses:
    - term: Pilot Period
      verbatim: '"14 days, starting the date that Company delivers the account administrator credentials"'
      fee: '"$0 USD"'
    - term: Initial Service Term
      verbatim: '"1 month, commencing on the day the Pilot Period expires"'
    - term: Renewal
      verbatim: '"automatically renewed for additional periods of the same duration as the Initial Service Term"'
    - term: Termination notice
      verbatim: >-
        "either party requests termination at least thirty (30) days prior to the end of the
        then-current term"; also "terminate this Agreement upon thirty (30) days' notice (or without
        notice in the case of nonpayment)"
    - term: Vendor suspension right
      verbatim: >-
        "terminate or suspend your access to the Services ... at any time, with or without cause, and
        without notice"
    - term: Customer data ownership
      verbatim: '"Customer shall own all right, title and interest in and to the Customer Owned Data"'
    - term: Vendor retention of derived data
      verbatim: >-
        Company retains "all data derived in the process of providing the Services which is part of
        Company's machine learning algorithms"
    notPublished: >-
      No exclusivity clause was found. No minimum volume commitment, full-content agreement, segment
      fee or per-booking fee is published — fees are deferred to a "Products & Services order form"
      that is not public, so the commercial rate card cannot be verified and is not asserted here.
    verdict: >-
      Unusually light for this industry. A one-month auto-renewing term terminable on thirty days'
      notice is closer to a SaaS subscription than to a travel-distribution contract; the asymmetry
      is the vendor's unilateral suspension right and its retention of the trained markup models.
  accessGate:
    value: commercial-agreement
    whatADeveloperMustDo:
    - Read the docs freely — devhub.tripninja.io requires no account and returns 200 to anyone.
    - >-
      Go through Trip Ninja's contact form (https://www.tripninja.io/contact) and a scoping exercise;
      the developer hub links a "Trip Ninja - Scoping Effort Sheet" PDF.
    - >-
      Sign the SaaS agreement at https://www.tripninja.io/legal/qt-tc (14-day pilot at $0, then a
      1-month auto-renewing term), plus the data-processing terms.
    - >-
      Already hold "at least one active integration with a content source, such as a Global
      Distribution System (GDS), New Distribution Capability (NDC), or other flight aggregator" —
      Trip Ninja supplies no air content of its own.
    - Already be able to book multiple PNRs against a single traveller itinerary.
    - >-
      Receive an Admin Panel username and password issued by Trip Ninja ("You have been provided with
      an admin panel username and password by Trip Ninja") — there is no signup form.
    - >-
      Send Trip Ninja the IP addresses to be allow-listed: "For security, Trip Ninja's servers are
      only accessible from whitelisted IPs. Please contact your account manager to whitelist the IPs
      you will be using."
    - Generate a sandbox token in the Admin Panel's Developer Resources section. Sandbox is capped at 5,000 requests per day.
    - >-
      Pass certification: "Once core development and integration for SmartFlights is complete,
      execute the required test cases to pass the certification process." Only then is a production
      base URL issued.
    noAccreditationRequired: >-
      No IATA or ARC accreditation is required to consume the Trip Ninja API itself — the accreditation
      burden sits upstream, on whatever content source the customer already holds.
  distributionModel:
    value: aggregator-reseller
    detail: >-
      Webjet OTA is a retail intermediary: it does not own inventory and resells airline, hotel and
      car content sourced through upstream distribution. Trip Ninja is one layer further removed — it
      is neither a distributor nor an aggregator of content but an optimisation service that operates
      on content the customer has already sourced: "Trip Ninja consumes the content sources ... without
      providing any content ourselves", with the documentation naming Amadeus and Travelport as example
      customer-side connections and marking segment "fees" as "*Travelport customers only*".
  ndcPosture:
    value: >-
      Not an airline, and no NDC role of its own. NDC appears exactly once in the entire harvested
      surface — as one of the acceptable upstream content sources a customer must already have ("a
      Global Distribution System (GDS), New Distribution Capability (NDC), or other flight
      aggregator"). No NDC certification level is claimed anywhere by Webjet Group or Trip Ninja, no
      NDC endpoint is published, and no GDS-versus-NDC surcharge position is stated. Webjet's own
      airline-content sourcing arrangements are not disclosed publicly and are not asserted here.
  standardConformance:
    value: >-
      OpenAPI 3.0.0 for description; no travel-domain standard implemented. No NDC, OpenTravel/OTA,
      HTNG, ONE Order or Arazzo artifact was found. IATA CODES are used as data (airport, city,
      carrier, passenger type) but IATA MESSAGE STANDARDS are not.
