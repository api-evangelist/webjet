note: >-
  Webjet Group's consumer brands (Webjet OTA, Airport Rentals, Motorhome Republic) publish no client
  libraries. Every package below is published by the group's Trip Ninja subsidiary. Both libraries are
  narrow "SDK Compression" helpers documented at https://devhub.tripninja.io/sdk/installation/ — they
  wrap authentication (POST /sdk/auth/ with X-Client-ID / X-Client-Secret, then Authorization: Token)
  and the mandatory zlib + Base64 request compression required by /generate-solutions/. They do not
  wrap the full SmartFlights operation surface. Registries probed with no first-party result: npm,
  Maven Central, pkg.go.dev, RubyGems, Packagist, crates.io.
