      On errors this carries the Trip Ninja error CODE as a string (e.g. "IE52"), not an HTTP status
      number. On 200 responses the same field carries the numeric HTTP status (e.g. 200). The type of
      this field therefore changes between success and failure.
    message: Human-readable description of the failure.
