  example_success: {status: 200, message: success}
http_statuses:
  '400': Invalid Input — carries an IExx validation code.
  '401': Unauthorized — "User is not authorized" (IE44 in the spec examples).
  '500': Server Error — no body schema published.
notes:
- >-
  IE44 is published with two different meanings. The OpenAPI 401 response examples use it for
  "User is not authorized"; the troubleshooting reference documents it as a data_source_list format
  error. Both are recorded below as the provider publishes them.
- No Retry-After, rate-limit or request-id header is documented on any error response.
- The prefix IE is used consistently but never expanded in the documentation.
